name: BedWars1058-DragonFix
main: dev.etran.DragonFixPlugin
version: ${version}
api-version: 1.13
softdepend: [BedWars1058, BedWars2023]
authors: [you]
description: Hypixel-style sudden death dragons for BedWars1058.
commands:
  bw-dragonfix:
    aliases: [bwdf]
    description: Admin command for BedWars1058-DragonFix.
    usage: /bw-dragonfix <reload | status | config ...>
    permission: dragonfix.admin
permissions:
  dragonfix.admin:
    default: op
